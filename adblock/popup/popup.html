<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>가벼운 광고 차단기</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="app">
      <header class="brand">
        <div class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" role="img">
            <path d="M12 2.5 20 6v5.3c0 5.1-3.4 8.7-8 10.2-4.6-1.5-8-5.1-8-10.2V6l8-3.5Z" />
            <path d="m8.7 12.1 2.1 2.1 4.7-4.8" />
          </svg>
        </div>
        <div>
          <h1>가벼운 광고 차단기</h1>
          <p>빠르고 조용하게</p>
        </div>
      </header>

      <section
        class="status-card"
        id="status-card"
        role="status"
        aria-live="polite"
        aria-atomic="true"
        aria-busy="true"
      >
        <div class="status-topline">
          <span class="status-indicator" aria-hidden="true"></span>
          <span id="status-label">상태 확인 중</span>
          <span class="count-pill" id="blocked-count">&hellip;</span>
        </div>
        <strong id="status-title">잠시만 기다려 주세요</strong>
        <p id="status-description">현재 탭의 차단 설정을 불러오고 있습니다.</p>
      </section>

      <section class="controls" aria-label="차단 설정">
        <label class="control-row" for="global-toggle">
          <span class="control-copy">
            <strong>광고 차단</strong>
            <small>사이트 예외를 제외하고 적용</small>
          </span>
          <input id="global-toggle" type="checkbox" disabled />
          <span class="switch" aria-hidden="true"></span>
        </label>

        <div class="divider"></div>

        <label class="control-row" for="site-toggle">
          <span class="control-copy">
            <strong>이 사이트에서 차단</strong>
            <small id="site-name">현재 사이트 확인 중</small>
          </span>
          <input id="site-toggle" type="checkbox" aria-describedby="site-toggle-hint" disabled />
          <span class="switch" aria-hidden="true"></span>
        </label>
        <p class="control-hint" id="site-toggle-hint">
          끄면 이 사이트의 광고 차단·납치 방지를 해제해요.
        </p>
      </section>

      <section class="controls hijack-controls" aria-label="클릭 납치 방지 설정">
        <label class="control-row" for="hijack-toggle">
          <span class="control-copy">
            <strong>클릭 납치 방지</strong>
            <small>이 사이트에서만 켜기 · 끄기</small>
          </span>
          <input id="hijack-toggle" type="checkbox" aria-describedby="hijack-summary" disabled />
          <span class="switch" aria-hidden="true"></span>
        </label>
        <p class="control-hint hijack-summary" id="hijack-summary" role="status" aria-live="polite">
          현재 페이지의 보호 상태를 확인하고 있어요.
        </p>
        <details class="hijack-options" id="hijack-options">
          <summary>차단 내역 · 허용 설정</summary>
          <label class="control-row compact-row" for="hijack-strict-toggle">
            <span class="control-copy">
              <strong>강화 팝업 차단</strong>
              <small>이 사이트에서 선택해서 사용</small>
            </span>
            <input id="hijack-strict-toggle" type="checkbox" aria-describedby="hijack-strict-hint" disabled />
            <span class="switch" aria-hidden="true"></span>
          </label>
          <p class="control-hint" id="hijack-strict-hint">
            정상 로그인·결제 팝업도 막힐 수 있어요.
          </p>
          <p class="hijack-reasons" id="hijack-reasons">아직 확인된 차단 내역이 없어요.</p>
          <div class="hijack-actions">
            <button id="hijack-allow-once" type="button" disabled>이번 페이지에서 허용</button>
            <button id="hijack-restore" type="button" disabled>보호 복구</button>
          </div>
          <p class="control-hint action-hint">
            광고 차단은 유지하며 납치 방지만 이번 페이지에서 해제해요.
            새로고침하면 복구되며, 막았던 이동을 자동 실행하지 않아요.
          </p>
        </details>
      </section>

      <p class="privacy-note">
        <svg viewBox="0 0 20 20" aria-hidden="true">
          <path d="M6.5 8V6.5a3.5 3.5 0 1 1 7 0V8M5 8h10v8H5V8Z" />
        </svg>
        방문 기록을 외부로 보내지 않습니다
      </p>
    </main>

    <script src="popup.js"></script>
  </body>
</html>
